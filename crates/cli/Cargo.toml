[package]
name = "scryptenc-cli"
version = "0.8.1"
edition.workspace = true
rust-version.workspace = true
description = "A command-line utility for encrypt and decrypt files"
homepage.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
keywords = ["scrypt"]
categories = ["command-line-utilities"]
include = ["/LICENSES", "/README.md", "/src"]

[[bin]]
name = "rscrypt"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
byte-unit = "5.2.0"
clap = { workspace = true, features = ["wrap_help"] }
clap_complete = "4.5.65"
clap_complete_nushell = "4.5.10"
dialoguer.workspace = true
fraction = { version = "0.15.3", default-features = false }
jiff = { version = "0.2.20", default-features = false, features = ["std"] }
scryptenc = { path = "../scryptenc", version = "0.10.0" }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.149", optional = true }
sysexits = "0.11.0"
sysinfo = "0.38.1"
thiserror = "2.0.18"

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.3"

[features]
default = ["json"]
json = ["dep:serde", "dep:serde_json"]

[lints]
workspace = true
